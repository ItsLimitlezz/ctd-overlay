name: Container image

# Builds the image (linux/amd64 + linux/arm64) and pushes it to GitHub Container Registry:
# ghcr.io/<owner>/<repo>. TrueNAS pulls it; no local Docker needed. Prod builds only (hub TEAM.md
# build policy): a release tag, or a run started by hand. docs/RELEASE.md has the steps.
#   tag v1.2.3 (pushed, or chosen as the run's ref) → :1.2.3, :1.2, :1 and :sha-… (10 §10.7; no "v")
#   main, by hand → :latest and :sha-…;  a "release/…" branch, by hand → :release-… and :sha-…
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # A release tag must name the version package.json has (v0.15.10 → 0.15.10), or no image.
      - if: startsWith(github.ref, 'refs/tags/v')
        run: |
          have="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$have" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but package.json says $have"
            exit 1
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
      # The image's own smoke check: it starts and answers /healthz.
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ctd-overlay:test
      - run: |
          docker run -d --name smoke -p 4848:4848 ctd-overlay:test
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:4848/healthz && break; sleep 1; done
          curl -fs http://127.0.0.1:4848/healthz
          docker logs smoke 2>&1 | tail -20
      # And its ffmpeg converts phone video as the tests expect (tagged BT.709, HDR tone-mapped).
      - run: docker run --rm -v "$PWD/test:/app/test:ro" --entrypoint node ctd-overlay:test --test --test-timeout=180000 test/media.test.js
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
