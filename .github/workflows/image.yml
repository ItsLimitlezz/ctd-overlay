name: Container image

# Builds the image and pushes it to GitHub Container Registry: ghcr.io/<owner>/<repo>.
# main → :latest and :sha-…; a "release/…" branch → :release-… (a build to test before merging);
# a tag v1.2.3 → :1.2.3, :1.2 and :1 (10 §10.7). TrueNAS pulls it; no local Docker needed.
on:
  push:
    branches: [main, 'release/**']
    tags: ['v*']
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
      # The image's own smoke check: it starts and answers /healthz.
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ctd-overlay:test
      - run: |
          docker run -d --name smoke -p 4848:4848 ctd-overlay:test
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:4848/healthz && break; sleep 1; done
          curl -fs http://127.0.0.1:4848/healthz
          docker logs smoke 2>&1 | tail -20
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
