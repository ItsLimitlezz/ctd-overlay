name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Linux only for now: the platform ships as a Linux container (TrueNAS). macOS and Windows
    # come back when there are builds for them (PLAN step 23).
    runs-on: ubuntu-latest
    timeout-minutes: 20 # a hung test fails the job instead of holding a runner for 6 h
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --version
      # A real ffmpeg, so phone-video conversion (H12) is tested end to end.
      - run: (command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)) && ffmpeg -version | head -1
      - run: npm test
