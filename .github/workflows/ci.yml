name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20 # a hung test fails the job instead of holding a runner for 6 h
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --version
      # A real ffmpeg on one OS, so phone-video conversion (H12) is tested end to end somewhere;
      # the others test without one, as many installs run.
      - if: runner.os == 'Linux'
        run: (command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)) && ffmpeg -version | head -1
      - run: npm test
