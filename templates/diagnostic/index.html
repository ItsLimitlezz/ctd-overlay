<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SKP diagnostic</title>
  <link rel="stylesheet" href="template.css">
</head>
<body>
  <section class="diag" aria-live="polite">
    <header><span class="dot" data-dot></span><b data-slug>…</b></header>
    <dl>
      <dt>Transport</dt><dd data-mode>connecting</dd>
      <dt>Envelopes</dt><dd data-received>0</dd>
      <dt>Last event</dt><dd data-last>—</dd>
      <dt>Server time</dt><dd data-clock>—</dd>
      <dt>Skew</dt><dd data-skew>—</dd>
      <dt>Counter</dt><dd data-counter>—</dd>
    </dl>
    <div class="track"><div class="sweep"></div></div>
  </section>
  <script src="template.js"></script>
</body>
</html>
