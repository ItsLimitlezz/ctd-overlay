<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Text &amp; Clock</title>
  <link rel="stylesheet" href="template.css">
</head>
<body>
  <template data-skp-scene="program">
    <div class="tc" data-tc>
      <div class="box" data-box hidden>
        <div class="line l1" data-line="1" hidden></div>
        <div class="line l2" data-line="2" hidden></div>
        <div class="line l3" data-line="3" hidden></div>
        <div class="clockwrap" data-clockwrap hidden>
          <div class="label" data-label hidden></div>
          <div class="clock" data-clock></div>
        </div>
      </div>
    </div>
  </template>
  <script src="clock.js"></script>
  <script src="template.js"></script>
</body>
</html>
